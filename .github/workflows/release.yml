name: Release

# Gdy na main trafi system.json z nową wersją (np. "0.2.0"), a wydania
# v0.2.0 jeszcze nie ma: tworzy tag i wydanie, pakuje foe-rpg.zip
# i dołącza go razem z system.json, żeby działał manifest URL w Foundry VTT.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź, czy ta wersja ma już wydanie
        id: check
        run: |
          TAG="v$(jq -r .version system.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — pomijam."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ustaw link do pobrania w system.json
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          jq --arg d "https://github.com/$REPO/releases/download/$TAG/foe-rpg.zip" \
             '.download = $d' system.json > system.tmp
          mv system.tmp system.json

      - name: Spakuj system
        if: steps.check.outputs.exists != 'true'
        run: zip -r foe-rpg.zip system.json README.md module templates styles

      - name: Utwórz wydanie
        if: steps.check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" system.json foe-rpg.zip -R "$REPO" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
